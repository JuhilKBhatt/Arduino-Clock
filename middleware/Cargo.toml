[package]
name = "esp32-clock-middleware"
version = "0.1.0"
edition = "2021"
description = "Ubuntu middleware controller for the ESP32 Multi-Functional Clock over MQTT, REST/WebSocket, and cloudflared"

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
